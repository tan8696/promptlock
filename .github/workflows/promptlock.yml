name: PromptLock

on:
  pull_request:
    paths:
      - "examples/**"
      - "promptlock.yaml"
      - ".promptlock/**"
      # The detector itself changes the verdicts, so it belongs in the gate.
      - "promptlock/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -e .

      # Offline by default. Set PROMPTLOCK_PROVIDER=anthropic and add
      # ANTHROPIC_API_KEY to run the suite against a real model.
      - name: promptlock check
        run: promptlock check --markdown report.md --json report.json --html report.html
        env:
          PROMPTLOCK_PROVIDER: ${{ vars.PROMPTLOCK_PROVIDER || 'mock' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      # `check` writes the report before it exits non-zero, so a regression
      # still comments. A crash (no baseline, bad config) writes nothing, and
      # the comment step would then fail on a missing file -- say so instead.
      - name: Ensure a report exists
        if: always()
        run: |
          test -s report.md || printf '## PromptLock\n\n**Run failed before a report could be written.** See the job log.\n' > report.md

      - name: Comment on PR
        if: always()
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: promptlock
          path: report.md

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: promptlock-report
          path: |
            report.json
            report.html
