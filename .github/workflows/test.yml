name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor declared in pyproject, and a current release.
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Unit tests
        run: coverage run -m pytest -q

      - name: Coverage
        run: coverage report

      # The acceptance gate. Exits 1 if recall drops below 6/6, false positives
      # rise above 1/10, or a model/parameter variant is misclassified -- so the
      # detector cannot regress silently.
      - name: Detector benchmark
        run: python scripts/benchmark.py

      # public/ and docs/ are committed generated output, and Vercel serves
      # whatever is in the repo. Change the detector without rebuilding and the
      # live demo quietly starts showing results the code no longer produces.
      #
      # This compares a fingerprint of the *sources* the site was built from,
      # not the generated bytes: drift values differ in the fourth decimal
      # between libm implementations, so byte-comparing pages built on Windows
      # against pages built on Linux tests the C library, not staleness.
      - name: Demo site is built from current code
        if: matrix.python-version == '3.12'
        run: python scripts/build_site.py --check

      # Cheap insurance that the generator itself still runs, which the
      # fingerprint check alone would not catch.
      - name: Demo site still builds
        if: matrix.python-version == '3.12'
        run: |
          python scripts/build_site.py
          python scripts/make_docs_svg.py
