name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor declared in pyproject, and a current release.
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Unit tests
        run: coverage run -m pytest -q

      - name: Coverage
        run: coverage report

      # The acceptance gate. Exits 1 if recall drops below 6/6, false positives
      # rise above 1/10, or a model/parameter variant is misclassified -- so the
      # detector cannot regress silently.
      - name: Detector benchmark
        run: python scripts/benchmark.py

      # public/ and docs/ are committed generated output, and Vercel serves
      # whatever is in the repo. Change the detector without rebuilding and the
      # live demo quietly starts showing results the code no longer produces.
      # Regenerating here and diffing makes that a build failure instead.
      # Safe to compare byte-for-byte: the mock is seeded and drift is clamped,
      # so the output is identical on 3.10, 3.12 and 3.14.
      - name: Demo site and docs are up to date
        if: matrix.python-version == '3.12'
        run: |
          # The baseline is checked separately: `record` now preserves
          # recorded_at when nothing else changed, so any diff here means the
          # recorded behaviour genuinely differs on this runner.
          if ! git diff --quiet -- .promptlock; then
            echo "::error::Baseline changed on this runner: $(git diff --stat -- .promptlock | tr '\n' ' ')"
          fi

          python scripts/build_site.py
          python scripts/make_docs_svg.py

          if ! git diff --quiet -- public docs; then
            echo "::error::Generated output is stale: $(git diff --stat -- public docs | tr '\n' ' ')"

            # These files are single enormous lines, so a line diff says
            # nothing. This reports the first differing character with context.
            python scripts/show_generated_diff.py public docs || true
            echo "Run: python3 scripts/build_site.py && python3 scripts/make_docs_svg.py, then commit."
            exit 1
          fi
