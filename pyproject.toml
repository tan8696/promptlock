[project]
name = "promptlock"
version = "0.1.0"
description = "CI for prompts: fail the PR when a prompt or model change silently degrades your LLM outputs."
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
dev = ["pytest>=8", "ruff>=0.6", "coverage>=7"]

[project.scripts]
promptlock = "promptlock.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["promptlock*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",    # long lines are caught by the formatter, not worth failing CI over
    "SIM108",  # ternaries are not always clearer than an if/else
]

[tool.ruff.lint.per-file-ignores]
# Fixtures are deliberately unrunnable samples for the AST walker to read.
"tests/fixtures/*" = ["F401", "B018"]
# Tests put the repo root on sys.path before importing the package under test.
"tests/*" = ["E402"]
# Scripts do the same, and are run as files rather than imported.
"scripts/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["promptlock"]

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:", "raise NotImplementedError"]
