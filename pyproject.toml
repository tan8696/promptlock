[project]
name = "promptlock"
version = "0.1.0"
description = "CI for prompts: fail the PR when a prompt or model change silently degrades your LLM outputs."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "tan8696" }]
keywords = ["llm", "prompt", "testing", "ci", "regression", "evaluation", "anthropic"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = ["PyYAML>=6.0"]

[project.urls]
Homepage = "https://github.com/tan8696/promptlock"
Repository = "https://github.com/tan8696/promptlock"
Issues = "https://github.com/tan8696/promptlock/issues"
Changelog = "https://github.com/tan8696/promptlock/releases"

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
dev = ["pytest>=8", "ruff>=0.6", "coverage>=7"]

[project.scripts]
promptlock = "promptlock.cli:main"

[build-system]
# 77+ for PEP 639 SPDX `license` / `license-files`.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["promptlock*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",    # long lines are caught by the formatter, not worth failing CI over
    "SIM108",  # ternaries are not always clearer than an if/else
]

[tool.ruff.lint.per-file-ignores]
# Fixtures are deliberately unrunnable samples for the AST walker to read.
"tests/fixtures/*" = ["F401", "B018"]
# Tests put the repo root on sys.path before importing the package under test.
"tests/*" = ["E402"]
# Scripts do the same, and are run as files rather than imported.
"scripts/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["promptlock"]

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:", "raise NotImplementedError"]
