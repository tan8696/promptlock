[project]
name = "promptlock"
version = "0.1.0"
description = "CI for prompts: fail the PR when a prompt or model change silently degrades your LLM outputs."
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]

[project.scripts]
promptlock = "promptlock.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["promptlock*"]
